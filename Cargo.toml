[package]
name = "xm-control"
version = "0.1.0"
edition = "2024"
description = "Control Sony WH-1000XM6 headphones from a Windows PC over Bluetooth"
repository = "https://github.com/Gronck2/xm-control"
license = "MIT"

[dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Devices_Bluetooth", "Win32_Networking_WinSock"] }

[profile.release]
lto = true
strip = true
